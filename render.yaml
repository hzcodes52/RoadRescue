services:
  - type: web
    name: roadrescue-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/auth/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://*.vercel.app,http://localhost:5173"
      - key: ADMIN_EMAIL
        value: "admin@roadrescue.in"
      - key: ADMIN_PASSWORD
        value: "admin12345"
