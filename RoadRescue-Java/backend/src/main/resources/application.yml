server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/roadrescue;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_UNTIL_1_9=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@roadrescue.in}
    password: ${ADMIN_PASSWORD:admin12345}
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
